name: Docker builds

on:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'engine/**'
      - 'ui/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'collector/**'
      - 'engine/**'
      - 'ui/**'
      - '.github/workflows/docker.yml'

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: collector
            context: collector
          - name: engine
            context: engine
          - name: ui
            context: ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true                              # keep the image in the local daemon so the smoke step can use it
          tags: kubehuddle/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Cheap smoke check: image starts and reports its version / help. Catches
      # broken entrypoints without needing a full k8s stack.
      - name: Smoke — collector
        if: matrix.name == 'collector'
        run: docker run --rm kubehuddle/collector:ci connectors list

      - name: Smoke — engine
        if: matrix.name == 'engine'
        run: docker run --rm kubehuddle/engine:ci --help

      - name: Smoke — ui
        if: matrix.name == 'ui'
        run: |
          # nginx-unprivileged listens on 8080 in-container (not 80), so map 8080:8080.
          docker run -d --name kh-ui -p 8080:8080 kubehuddle/ui:ci
          # Wait for nginx; dump logs if it never becomes reachable, so a broken
          # image gives us something useful to look at.
          ok=0
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "::error::UI never came up on http://127.0.0.1:8080/"
            docker logs kh-ui || true
            docker rm -f kh-ui || true
            exit 1
          fi
          curl -sf http://127.0.0.1:8080/ | grep -q "Kube Huddle"
          docker rm -f kh-ui
