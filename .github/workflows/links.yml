name: Markdown links

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.github/workflows/links.yml'
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/links.yml'

concurrency:
  group: links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            --verbose
            --no-progress
            --exclude-loopback
            --exclude 'example\.com'
            --exclude 'kubehuddle\.example\.com'
            --exclude 'k8s\.prod'
            --max-concurrency 8
            'README.md'
            'docs/**/*.md'
            '**/README.md'
          fail: true
