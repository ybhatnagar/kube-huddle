name: Helm chart

on:
  push:
    branches: [main]
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm.yml'
  pull_request:
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm.yml'

concurrency:
  group: helm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint chart
        run: helm lint deploy/helm/kubehuddle

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/

      - name: Validate rendered manifests (default values)
        run: |
          helm template kh deploy/helm/kubehuddle \
            | kubeconform -strict \
                          -kubernetes-version 1.30.0 \
                          -schema-location default \
                          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      - name: Validate rendered manifests (production preset — external DB + ingress)
        run: |
          helm template kh deploy/helm/kubehuddle \
            --set postgres.enabled=false \
            --set database.existingSecret=kubehuddle-db \
            --set ingress.enabled=true \
            --set ingress.host=kubehuddle.example.com \
            --set ingress.className=nginx \
            | kubeconform -strict \
                          -kubernetes-version 1.30.0 \
                          -schema-location default \
                          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
