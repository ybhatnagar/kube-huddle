# Standalone serving config (baked into the image). The Helm chart overrides this with
# a version that also proxies /api/ to the engine service for a single-origin setup.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
