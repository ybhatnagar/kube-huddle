{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kubehuddle.fullname" . }}
  labels:
    {{- include "kubehuddle.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # /api -> engine, everything else -> UI (single origin).
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubehuddle.engine.fullname" . }}
                port:
                  number: {{ .Values.engine.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubehuddle.ui.fullname" . }}
                port:
                  number: {{ .Values.ui.service.port }}
{{- end }}
