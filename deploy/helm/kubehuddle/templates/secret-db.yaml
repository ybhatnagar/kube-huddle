{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubehuddle.dbSecretName" . }}
  labels:
    {{- include "kubehuddle.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Full connection string consumed by the collector + engine as KUBEHUDDLE_DB_DSN.
  dsn: {{ include "kubehuddle.dbDsn" . | quote }}
{{- end }}
